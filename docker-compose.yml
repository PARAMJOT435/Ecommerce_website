version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: htm_ecomm_db
    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_password
      POSTGRES_DB: htm_ecomm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - htm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: htm_ecomm_backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ecommerce_user:ecommerce_password@postgres:5432/htm_ecomm
      JWT_SECRET: your_jwt_secret_key_change_this_in_production
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
    networks:
      - htm_network
    command: npm run dev

volumes:
  postgres_data:

networks:
  htm_network:
    driver: bridge
